---
# https://github.com/crc-org/crc-cloud/blob/main/pkg/bundle/setup/clustersetup.sh#L159
- name: "Check if specified OpenShift components are healthy {{ wait_components }}"
  ansible.builtin.shell: |
    set -o pipefail
    oc get co --no-headers | grep -E '{{ wait_components }}'
  register: component_status
  retries: "{{ max_retries }}"
  delay: "{{ retry_delay }}"
  until: >
    (component_status.rc == 0) and
    ('False' not in component_status.stdout) and
    ('was refused' not in component_status.stderr)
  changed_when: false

- name: Show component status
  ansible.builtin.debug:
    msg: "{{ component_status.stdout_lines }}"
